name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: CI only checks out and tests.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The website + API live in web-app/ (the Flutter app is in mobile-app/).
    defaults:
      run:
        working-directory: web-app

    env:
      DATABASE_URL: postgresql://maintainx:maintainx@localhost:5432/maintainx_test?schema=public
      JWT_ACCESS_SECRET: ci-access-secret-ci-access-secret-ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret-ci-refresh-secret-ci-refresh-secret
      CORS_ORIGIN: http://localhost:5173
      APP_URL: http://localhost:5173

    steps:
      - uses: actions/checkout@v4

      # PostgreSQL comes preinstalled on GitHub's Ubuntu runners: start it
      # directly (no Docker containers).
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          for i in $(seq 1 20); do pg_isready -h localhost && break; sleep 1; done
          sudo -u postgres psql -c "CREATE USER maintainx WITH PASSWORD 'maintainx' CREATEDB;"
          sudo -u postgres psql -c "CREATE DATABASE maintainx_test OWNER maintainx;"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web-app/package-lock.json

      - run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate
        working-directory: web-app/apps/server

      - name: Apply migrations
        run: npx prisma migrate deploy
        working-directory: web-app/apps/server

      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
